[package]
name = "mod-repeatable_trial_vaults"
version = "0.2.0"
edition = "2024"
license = "MIT OR CC0-1.0"
description = "Repeatable Trial Vaults for Horizon: a trial key resets a vault that already rewarded the player"
# Ported from: Repeatable Trial Vaults 1.0.3 (Buuz135/Repeatable-Trial-Vaults,
# MIT per META-INF/neoforge.mods.toml; the repository ships the CC0-1.0 text),
# Minecraft Java 1.21.1 NeoForge/Fabric.
# LOCAL-ONLY until the licence allows derivatives and the maintainer approves
# publishing (ARCHITECTURE.md §8).

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
# No other dependency: the pure runtime needs nothing, and a registry crate would have to be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
