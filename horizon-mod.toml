id = "repeatable_trial_vaults"
name = "Repeatable Trial Vaults"
version = "0.2.0"
description = """Consume a key to be able to use another trial vault: a trial key on a vault that already rewarded you clears you from its rewarded list, so the same player can loot it again."""
authors = ["Buuz135 (upstream)", "Horizon native mod contributors"]
# The SDK package (mod API 0.2): one flat .hmod with the code in src/ and the carried
# tag/lang in data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
side = "both"
# Required by the manifest schema. This mod adds no registry entry (the check report's
# `capabilities` is empty); the field is a permission, not a claim.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
